<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIGPER · Obras en 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* VOICE: maqueta de obra: juguetona en la imagen, seria en los datos.
   IDEA: la mesa de maquetas de la oficina técnica: cada obra es un terreno sobre el mapa que se construye según sus hitos.
   PICTURE: dioramas low-poly en 3D con camiones, retros, camionetas y personas que se mueven; se giran y se tocan.
   COLOUR and TYPE: manual SIGPER (#255A9B, #347CB1, #279DCA, #1B191A) para la interfaz; amarillo maquinaria y tierra en la escena. Montserrat + Inter.
   LAYOUT: escena arriba (o a la izquierda en pantalla ancha) y panel de datos abajo (o a la derecha). */
:root{color-scheme:light dark;--bg:light-dark(#f6f8fb,#0f1620);--card:light-dark(#fff,#18222f);--ink:light-dark(#1B191A,#eef2f7);--mute:light-dark(#5b6470,#9aa7b6);--line:light-dark(#e3e8ef,#2a3647);--soft:light-dark(#e8f1fa,#1c2e45);--deep:#255A9B;--mid:#347CB1;--sky:#279DCA;--ok:light-dark(#1f8a4c,#4cc584);--warn:light-dark(#b7791f,#f0b44c);--bad:light-dark(#c0392b,#ff7b6b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Montserrat,Arial,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
.top{background:var(--deep);color:#fff;padding:10px max(3vw,12px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font:800 20px Montserrat,sans-serif;display:flex;align-items:center;gap:8px}
.logo i{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--sky),var(--mid));box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.logo small{font:500 13px Inter,sans-serif;opacity:.85}
.hdrbtn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.loadbox{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:20px}.loadbox[hidden]{display:none}.loadbox p{max-width:420px;margin:0 auto}
.spin{width:30px;height:30px;border:3px solid var(--soft);border-top-color:var(--mid);border-radius:50%;margin:8px auto;animation:rr 1s linear infinite}@keyframes rr{to{transform:rotate(1turn)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.panel a{color:var(--mid)}
.demo{margin-left:auto;font-size:12px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:99px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100vh - 52px);min-height:560px}
.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#f7f5f1,#dedad2)}
:root[data-theme=dark] .stage{background:radial-gradient(ellipse at 50% 30%,#2a3038,#12161b)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .stage{background:radial-gradient(ellipse at 50% 30%,#2a3038,#12161b)}}
canvas{display:block;width:100%;height:100%;touch-action:none}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font:600 13px Inter,sans-serif;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.lbl b{font-family:Montserrat;color:var(--deep)}:root[data-theme=dark] .lbl b{color:var(--sky)}
.lbl[hidden]{display:none!important}
.lbl .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.lbl.town{background:none;border:0;box-shadow:none;font:700 12px Montserrat;color:#4b5a6b;letter-spacing:.04em;pointer-events:none}
.hud{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap}
button{font:600 15px Inter,sans-serif;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;cursor:pointer}
button.pri{background:var(--deep);color:#fff;border-color:var(--deep)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--mute);background:var(--card);border-radius:8px;padding:4px 8px;opacity:.9}
.pop{position:absolute;left:12px;bottom:12px;max-width:min(320px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pop h3{font-size:16px}.pop[hidden]{display:none}
.panel{overflow-y:auto;border-left:1px solid var(--line);padding:16px}
.panel h2{font-size:clamp(20px,4vw,26px)}
.meta{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.ob{cursor:pointer;display:block;width:100%;text-align:left;min-height:auto;padding:12px 14px;margin-top:10px}
.ob:hover{border-color:var(--mid)}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--mid);border-radius:6px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}.row .v{font-weight:600;white-space:nowrap;text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px Inter;padding:2px 9px;border-radius:99px;background:var(--soft);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-info{color:var(--mid)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.kpi b{display:block;font:700 20px Montserrat;color:var(--deep)}:root[data-theme=dark] .kpi b{color:var(--sky)}.kpi span{font-size:12px;color:var(--mute)}
.hito{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.hito:first-child{border-top:0}
.hito .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff}
.hito.done .ck{background:var(--ok);border-color:var(--ok)}.hito.now .ck{border-color:var(--sky);background:conic-gradient(var(--sky) var(--p),transparent 0)}
input[type=range]{width:100%;height:44px;accent-color:var(--deep)}
.sec{margin-top:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3{font-size:16px}
.alert{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--soft);margin-top:6px;display:flex;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
@media(max-width:860px){.app{grid-template-columns:1fr;height:auto}.stage{height:58vh;min-height:360px}.panel{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header class="top"><div class="logo"><i aria-hidden="true"></i>SIGPER <small>Obras en 3D</small></div><span class="demo" id="srcInfo">Conectando con Google Drive…</span><button type="button" id="reload" class="hdrbtn">Actualizar</button></header>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div class="hud"><button type="button" id="back" hidden>← Mapa</button></div>
    <div class="pop" id="pop" hidden></div>
    <div class="loadbox" id="load"></div>
    <div class="hint" id="hint">Arrastra para girar · pellizca para acercar · toca una obra</div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>
<script>
{
/* ---------------- Datos ficticios ---------------- */
/* ---------------- Datos reales (Google Drive del visitante) ---------------- */
let OBRAS=[];
const TIPO={tolva:'Camión tolva',retro:'Retroexcavadora',camioneta:'Camioneta',excavadora:'Excavadora',mixer:'Camión mixer',pluma:'Camión pluma'};
const ROLC={Capataz:'#f4f4f4',Maestro:'#f08a24',Jornal:'#f2c230',Operador:'#279DCA',Chofer:'#255A9B'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp=v=>v==null||isNaN(v)?'—':'$'+Math.round(v).toLocaleString('es-CL');
const pct=v=>v==null||isNaN(v)?'—':Math.round(v*100)+'%';
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const num=v=>typeof v==='number'?v:null;
const toDate=v=>v instanceof Date?v:null;
const fd=d=>d?d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
const DAY=864e5,today=new Date();today.setHours(0,0,0,0);
const SERVER='Google Drive',XMIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
/* Tipo de escena: el de Maestros manda. Si está vacío se usa la propuesta aprobada por JJ el 27-11-2026. */
const ESCENA={'movimiento de tierra':'tierra','obras civiles':'civil','apoyo electrico':'electrica','arriendo':'arriendo'};
const ESCENA_N={tierra:'Movimiento de tierra',civil:'Obras civiles',electrica:'Apoyo eléctrico',arriendo:'Arriendo'};
const PROPUESTA={'PRY-0001':'arriendo','PRY-0010':'arriendo','PRY-0011':'arriendo','PRY-0002':'tierra','PRY-0003':'civil','PRY-0004':'civil','PRY-0007':'civil','PRY-0005':'electrica','PRY-0006':'electrica','PRY-0008':'electrica','PRY-0009':'electrica'};
/* Latitud aproximada de cada comuna, solo para ordenar el mapa de norte a sur. */
const LATC={'antofagasta':-23.65,'salamanca':-31.78,'santiago':-33.45,'melipilla':-33.69,'buin':-33.73,'rancagua':-34.17,'machali':-34.18,'rengo':-34.41,'san fernando':-34.58,'chimbarongo':-34.71};
const OCULTOS=/^(perdido|cerrado|fusionado|permanente)/;

const grid=(wb,name)=>{const k=wb.SheetNames.find(n=>norm(n)===norm(name));return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,raw:true,defval:null}):null};
function table(g,heads){if(!g)return[];const H=heads.map(norm);
  for(let r=0;r<g.length;r++){const row=g[r]||[];for(let c=0;c<row.length;c++){if(!H.every((h,k)=>norm(row[c+k])===h))continue;
    const head=[];for(let j=c;j<row.length&&row[j]!=null&&row[j]!=='';j++)head.push(norm(row[j]));
    const out=[];for(let i=r+1;i<g.length;i++){const x=g[i]||[];if(x[c]==null||x[c]==='')break;const o={};head.forEach((h,k)=>o[h]=x[c+k]);out.push(o)}return out}}
  return[]}
const pick=(o,...ns)=>{for(const n of ns){const m=norm(n),ok=k=>o[k]!=null&&o[k]!=='';if(m in o&&ok(m))return o[m];const k=Object.keys(o).find(k=>k.startsWith(m)&&ok(k));if(k)return o[k]}return null};
function named(wb,n){const N=(wb.Workbook&&wb.Workbook.Names||[]).find(x=>x.Name===n);if(!N)return null;const m=String(N.Ref).match(/^'?(.+?)'?!\$?([A-Z]+)\$?(\d+)/);if(!m)return null;const ws=wb.Sheets[m[1]];const c=ws&&ws[m[2]+m[3]];return c?c.v:null}
function findB64(x,d=0){if(d>6||x==null)return null;if(typeof x==='string'){const s=x.replace(/\s/g,'');return s.length>200&&/^UEsDB/.test(s)?s:null}
  if(typeof x==='object'){for(const k of Object.keys(x)){const r=findB64(x[k],d+1);if(r)return r}}return null}
const asObj=p=>{if(typeof p==='string'){try{return JSON.parse(p)}catch{return{}}}return p||{}};
let MCP=null;
async function search(q){const r=await MCP.callTool(SERVER,'search_files',{query:q,excludeContentSnippets:true,pageSize:60});return asObj(r.payload).files||[]}
async function dl(f){const r=await MCP.callTool(SERVER,'download_file_content',{fileId:f.id});const b=findB64(r);if(!b)throw{code:'no_binary'};return XLSX.read(b,{type:'base64',cellDates:true})}
const newest=fs=>fs.slice().sort((a,b)=>String(b.modifiedTime).localeCompare(String(a.modifiedTime)))[0];
async function byTitle(t){return newest((await search(`title = '${t}' and trashed = false`)).filter(f=>f.mimeType===XMIME))}
const errText=e=>({needs_reauth:'Tu conexión con Google Drive venció. Vuelve a conectarla en claude.ai → Configuración → Conectores.',server_not_connected:'Agrega el conector Google Drive en claude.ai → Configuración → Conectores.',selection_required:'Tienes más de un conector Google Drive: elige uno en el aviso de Claude.',not_in_manifest:'No se dio permiso a esta página para usar Google Drive. Recárgala y acepta el aviso.',approval_required:'Falta aprobar el acceso a Google Drive. Pulsa Reintentar y acepta el aviso.',blocked_by_policy:'Tu organización bloquea esta herramienta de Google Drive.',no_binary:'Drive respondió, pero sin el archivo .xlsx.',no_file:'No encontré SIGPER_Finanzas.xlsx en tu Drive (o no tienes acceso).',no_mcp:'Esta vista no puede usar tus conectores (ábrela en claude.ai).'}[e&&e.code]||('No se pudo leer Drive'+(e&&e.message?': '+e.message:'.')));

let SRC={},EQ={};
function eqTipo(t){t=norm(t);return/tolva/.test(t)?'tolva':/retro/.test(t)?'retro':/excavadora/.test(t)?'excavadora':/mixer/.test(t)?'mixer':/pluma|grua/.test(t)?'pluma':'camioneta'}
function horasMes(idq){const rs=EQ.hor.filter(r=>r.id===idq).sort((a,b)=>a.f-b.f);const m0=new Date(today.getFullYear(),today.getMonth(),1);
  const prev=rs.filter(r=>r.f<m0).pop(),inm=rs.filter(r=>r.f>=m0);if(!inm.length)return{hrs:0,last:prev||null};const base=prev||inm[0],last=inm[inm.length-1];return{hrs:last.l-base.l,last}}
function equiposDe(id){
  return EQ.asig.filter(a=>pick(a,'ID_PRY')===id&&(!toDate(pick(a,'Hasta'))||toDate(pick(a,'Hasta'))>=today)).map(a=>{
    const eid=pick(a,'ID_EQ'),c=EQ.cat.find(x=>pick(x,'ID_EQ')===eid)||{},pat=pick(c,'Patente')||pick(a,'Patente')||eid;
    const det=EQ.det.find(d=>pick(d,'ID_EQ')===eid&&toDate(pick(d,'Desde'))&&toDate(pick(d,'Desde'))<=new Date()&&(!toDate(pick(d,'Hasta'))||toDate(pick(d,'Hasta'))>new Date()));
    const estTxt=det?'Detenido':String(pick(c,'Estado')||'Sin estado');const med=norm(pick(c,'Medidor'));const h=horasMes(eid);
    const carga=EQ.comb.filter(r=>norm(pick(r,'Patente'))===norm(pat)&&toDate(pick(r,'Fecha'))).sort((x,y)=>pick(y,'Fecha')-pick(x,'Fecha'))[0];
    return{t:eqTipo(pick(c,'Tipo')),tipoN:pick(c,'Tipo')||'Equipo',pat,eid,est:det?'Detenido':'Operativo',estTxt,det,prov:pick(c,'Proveedor'),
      hrs:med==='horas'?h.hrs:null,min:num(pick(c,'Mínimo h/mes')),ult:h.last,med,ch:carga?pick(carga,'Chofer'):'—',desde:toDate(pick(a,'Desde'))}})}
function personalDe(id){return(SRC.remuAsig||[]).filter(a=>pick(a,'ID_PRY')===id&&(!toDate(pick(a,'Hasta'))||toDate(pick(a,'Hasta'))>=today)).map(a=>{
  const f=(SRC.fichas||[]).find(x=>pick(x,'ID_EMP')===pick(a,'ID_EMP'))||{};const cargo=String(pick(f,'Cargo')||'');
  const r=['Capataz','Maestro','Jornal','Operador','Chofer'].find(k=>norm(cargo).includes(norm(k)))||'Jornal';return{n:pick(f,'Nombre')||pick(a,'Nombre')||pick(a,'ID_EMP'),r,cargo,a:null}})}
function leerPRY(o,wb){const N=k=>named(wb,'RES_'+k);
  o.res={avance:num(N('AvanceFisico')),avCosto:num(N('AvanceCosto')),facturado:num(N('Facturado')),cobrado:num(N('Cobrado')),porCobrar:num(N('PorCobrar')),
    costoEst:num(N('CostoEstimado')),costoReal:num(N('CostoReal')),margenEst:num(N('MargenEstPct')),margenReal:num(N('MargenRealPct')),atraso:num(N('DiasAtraso')),
    alertaAv:N('AlertaAvance'),alertaFac:N('AlertaFacturacion'),estadoAnotado:N('EstadoAnotado'),inicio:toDate(N('InicioPlan')),termino:toDate(N('TerminoPlan')),terminoReal:toDate(N('TerminoReal'))};
  const plan=table(grid(wb,'Planificación'),['N°','Actividad']).map(p=>({n:String(pick(p,'Actividad')||''),ini:toDate(pick(p,'Inicio plan')),fin:toDate(pick(p,'Fin plan')),
    pct:num(pick(p,'% avance (manual)'))??num(pick(p,'% avance')),est:String(pick(p,'Estado')||''),hito:/^s/i.test(String(pick(p,'Hito')||''))}));
  const act=plan.filter(p=>!p.hito).sort((a,b)=>(a.ini||0)-(b.ini||0));o.hitos=act.map(p=>({...p,p:100/Math.max(1,act.length),f:fd(p.fin)}));o.clave=plan.filter(p=>p.hito);
  o.avance=o.res.avance!=null?Math.round(o.res.avance*100):0;o.avPlan=o.avance;if(/^terminado/i.test(o.estado))o.avance=100;o.loaded=true}
async function cargarPRY(o){if(o.loaded||!o.file)return;const wb=await dl(o.file);leerPRY(o,wb)}

async function boot(){
  setStatus('Buscando planillas SIGPER en tu Google Drive…',true);
  try{
    MCP=await claude.use('mcp');if(!MCP)throw{code:'no_mcp'};
    const[fF,fE,fR,pry]=await Promise.all([byTitle('SIGPER_Finanzas.xlsx'),byTitle('SIGPER_Equipos.xlsx'),byTitle('SIGPER_Remuneraciones.xlsx'),search("title contains 'PRY-0' and trashed = false")]);
    if(!fF)throw{code:'no_file'};SRC.files={fF,fE,fR};
    setStatus('Leyendo Finanzas, Equipos y Remuneraciones…',true);
    const[wF,wE,wR]=await Promise.all([dl(fF),fE?dl(fE):null,fR?dl(fR).catch(()=>null):null]);
    const maes=table(grid(wF,'Maestros'),['ID_PRY','Proyecto']);
    EQ={cat:[],asig:[],hor:[],det:[],comb:[]};
    if(wE){EQ.cat=table(grid(wE,'Catálogo'),['ID_EQ','Tipo']);EQ.asig=table(grid(wE,'Asignación'),['Patente','ID_PRY']);
      EQ.hor=table(grid(wE,'Horómetros'),['Fecha','Patente','Lectura']).map(r=>({f:toDate(pick(r,'Fecha')),id:pick(r,'ID_EQ'),l:num(pick(r,'Lectura'))})).filter(r=>r.f&&r.id&&r.l!=null);
      EQ.det=table(grid(wE,'Detenciones'),['Patente','Desde','Hasta']);EQ.comb=table(grid(wE,'Combustible'),['Fecha','ID_PRY','Patente'])}
    if(wR){SRC.remuAsig=table(grid(wR,'Asignación'),['ID_EMP','ID_PRY']);SRC.fichas=table(grid(wR,'Fichas'),['ID_EMP','Nombre'])}
    const pfiles={};for(const f of pry){const m=String(f.title).match(/^(PRY-\d{4}) .+\.xlsx$/);if(m&&f.mimeType===XMIME)(pfiles[m[1]]=pfiles[m[1]]||[]).push(f)}
    OBRAS=maes.filter(r=>/^PRY-\d{4}$/.test(String(pick(r,'ID_PRY')))&&!['PRY-0000','PRY-0099'].includes(pick(r,'ID_PRY'))&&!OCULTOS.test(norm(pick(r,'Estado')))).map(r=>{
      const id=pick(r,'ID_PRY'),esc0=ESCENA[norm(pick(r,'Tipo de escena'))],estado=String(pick(r,'Estado')||'Sin estado');
      const lat=num(pick(r,'Latitud')),com=String(pick(r,'Comuna')||'');
      return{id,nombre:String(pick(r,'Proyecto')||id),cliente:String(pick(r,'Cliente')||''),comuna:com,estado,lic:/^licitacion/.test(norm(estado)),
        tipo:esc0||PROPUESTA[id]||'civil',escFuente:esc0?'Maestros':'propuesta (Maestros vacío)',lat:lat??LATC[norm(com)]??null,
        file:pfiles[id]?newest(pfiles[id]):null,dup:(pfiles[id]||[]).length,avance:0,hitos:[],clave:[],res:{},loaded:false,equipos:equiposDe(id),personal:personalDe(id)}});
    setStatus('Leyendo las planillas de las obras activas…',true);
    await Promise.all(OBRAS.filter(o=>!o.lic&&o.file).map(o=>cargarPRY(o).catch(e=>{o.err=errText(e)})));
    SRC.at=new Date();setStatus(null);initWorld()}
  catch(e){setStatus(errText(e),false,true)}}

    <div class="sec"><h3>En marcha</h3></div>${act.map(obCard).join('')||'<p class="meta">Ninguna.</p>'}
    <div class="sec"><h3>En licitación</h3></div>${lic.map(obCard).join('')}
    <div class="legend"><span><i style="background:var(--ok)"></i>Sin alertas</span><span><i style="background:var(--warn)"></i>Revisar</span><span><i style="background:var(--bad)"></i>Equipo detenido</span><span><i style="background:#9aa3ad"></i>Licitación</span></div>`;
    P.querySelectorAll('.ob').forEach(b=>b.onclick=()=>select(b.dataset.id));return}
  const o=cur.o;
  if(!o.loaded&&o.file){P.innerHTML=`<div class="meta">${esc(o.id)}</div><h2>${esc(o.nombre)}</h2><div class="spin"></div><p class="meta">Leyendo ${esc(o.file.title)}…</p>`;
    cargarPRY(o).catch(e=>{o.err=errText(e);o.loaded=true}).then(()=>{if(cur&&cur.o===o){buildProg(cur,o.lic?0:o.avance/100);panel()}});return}
  const a=alertsOf(o),R=o.res||{};let acc=0;const H=o.hitos.map(h=>{const s=acc;acc+=h.p;return{...h,s,e:acc}});
  const link=o.file&&/^https:\/\//.test(o.file.viewUrl||'')?`<a href="${esc(o.file.viewUrl)}" target="_blank" rel="noopener">${esc(o.file.title)}</a>`:esc(o.file?o.file.title:'sin planilla');
  const fin=[['Facturado',R.facturado],['Cobrado',R.cobrado],['Por cobrar',R.porCobrar],['Costo estimado',R.costoEst],['Costo real a la fecha',R.costoReal]].filter(x=>x[1]!=null);
  P.innerHTML=`<div class="meta">${esc(o.id)} · ${esc(ESCENA_N[o.tipo])}${o.escFuente!=='Maestros'?' (escena propuesta)':''}</div><h2>${esc(o.nombre)}</h2>
  <div class="meta">${esc(o.cliente)} · ${esc(o.comuna||'sin comuna')} · <span class="chip ${o.lic?'':'c-info'}">${esc(o.estado)}</span></div>
  <div class="kpis"><div class="kpi"><b>${o.lic?'—':/^terminado/i.test(o.estado)?'Terminada':o.avance+'%'}</b><span>avance físico${/^terminado/i.test(o.estado)&&o.avPlan!=null?' (planilla: '+o.avPlan+'%)':''}</span></div><div class="kpi"><b>${R.porCobrar!=null?clp(R.porCobrar):'—'}</b><span>por cobrar (neto)</span></div><div class="kpi"><b>${pct(R.margenReal)}</b><span>margen real (est. ${pct(R.margenEst)})</span></div></div>
  ${a.map(x=>`<div class="alert"><span class="chip c-${x[0]}"></span><span>${esc(x[1])}</span></div>`).join('')}
  <div class="sec"><h3>Actividades</h3><span class="meta" id="simLbl">${o.lic?'Simulación':'Avance real'}</span></div>
  <input type="range" id="sim" min="0" max="100" value="${o.lic?0:o.avance}" aria-label="Ver la obra en otra etapa">
  <div class="card" id="hitos"></div>
  ${o.clave.length?`<div class="sec"><h3>Hitos clave</h3></div><div class="card">${o.clave.map(h=>`<div class="row"><span>${esc(h.n)}</span><span class="v">${fd(h.fin||h.ini)} · ${esc(h.est)}</span></div>`).join('')}</div>`:''}
  <div class="sec"><h3>Equipos asignados</h3><span class="meta">toca uno en la escena</span></div>
  <div class="card">${o.equipos.map(e=>`<div class="row"><span>${esc(e.tipoN)}<br><small class="meta">${esc(e.pat)} · ${esc(e.prov||'')}</small></span><span class="v">${e.min&&e.hrs!=null?Math.round(e.hrs)+'/'+e.min+' h ':''}<span class="chip ${e.est==='Operativo'?'c-ok':'c-bad'}">${esc(e.estTxt)}</span></span></div>`).join('')||'<p class="meta">Sin equipos asignados en SIGPER_Equipos.</p>'}</div>
  <div class="sec"><h3>Personal</h3></div>
  <div class="card">${o.personal.map(p=>`<div class="row"><span>${esc(p.n)}</span><span class="v">${esc(p.cargo||p.r)}</span></div>`).join('')||'<p class="meta">Sin personal asignado a esta obra en SIGPER_Remuneraciones.</p>'}</div>
  ${fin.length?`<div class="sec"><h3>Finanzas</h3><span class="meta">neto</span></div><div class="card">${fin.map(([k,v])=>`<div class="row"><span>${k}</span><span class="v">${clp(v)}</span></div>`).join('')}</div>`:''}
  <p class="meta" style="margin-top:14px">Fuente: ${link}${o.file&&o.file.modifiedTime?' · modificada '+new Date(o.file.modifiedTime).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}.</p>`;
  const real=v=>v===(o.lic?0:o.avance);
  const drawH=v=>{$('#hitos').innerHTML=H.map(h=>{let pp,st;if(real(v)&&!o.lic){pp=h.pct!=null?Math.round(h.pct*100):0;st=pp>=100?'done':pp>0?'now':''}else{st=v>=h.e?'done':v>h.s?'now':'';pp=st==='now'?Math.round((v-h.s)/h.p*100):st?100:0}
    return`<div class="hito ${st}" style="--p:${pp}%"><span class="ck">${st==='done'?'✓':''}</span><span>${esc(h.n)}<br><small class="meta">${fd(h.ini)} → ${esc(h.f)}${real(v)&&h.est?' · '+esc(h.est):''}</small></span><span class="meta">${pp}%</span></div>`}).join('')||'<p class="meta">Sin actividades en la hoja Planificación.</p>'};
  drawH(+$('#sim').value);const sim=$('#sim');sim.oninput=()=>{const v=+sim.value;buildProg(cur,v/100);drawH(v);$('#simLbl').textContent=real(v)?(o.lic?'Simulación':'Avance real'):'Simulación: '+v+'%'}}

/* bucle */
function size(){const r=cv.parentElement.getBoundingClientRect();R.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(cv.parentElement);size();
const clock=new THREE.Clock();const v=new THREE.Vector3();
function loop(){const t=reduce?0:clock.getElapsedTime();
  if(flying){cam.position.lerp(goal.p,.08);ctl.target.lerp(goal.t,.08);if(cam.position.distanceTo(goal.p)<.3)flying=0}
  ctl.update();Object.values(lots).forEach(l=>{if(!cur||cur===l){l.anim.forEach(f=>f(t));l.panim.forEach(f=>f(t))}});R.render(scene,cam);
  const r=cv.getBoundingClientRect();tags.forEach(g=>{if(g.d.hidden)return;v.copy(g.pos).project(cam);g.d.style.display=v.z>1?'none':'';g.d.style.left=((v.x+1)/2*r.width)+'px';g.d.style.top=((1-v.y)/2*r.height)+'px'});
  requestAnimationFrame(loop)}
panel();loop();$('#reload').onclick=()=>location.reload();if(typeof XLSX==='undefined')setStatus('No cargó el lector de Excel. Revisa tu conexión y recarga.',false,true);else boot();
}
}
</script>
